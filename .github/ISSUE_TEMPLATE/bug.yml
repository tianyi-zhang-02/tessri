name: Something broke
description: A crash, an error, an output that is not what the guide says.
labels: ["bug"]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, from the repository root, with its flags.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output or the traceback, as printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The guide page that says so, if one does.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`tessri --version`, the Python version, and the operating system."
    validations:
      required: true
  - type: textarea
    id: repository
    attributes:
      label: The repository
      description: A link if it is public, or how to make a small one that shows it. Say its size in files if you cannot share it.
