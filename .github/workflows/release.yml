# A version tag publishes the package. `git tag v0.3.0 && git push origin v0.3.0` checks that the tag is the version
# the code states and that CHANGELOG.md has that version's dated section, builds the sdist and the wheel, installs
# the wheel on every supported Python and runs it on this repository, publishes to PyPI through trusted publishing
# (no token anywhere in the repository), and creates the GitHub release with the changelog section and the files.
# One-time setup on PyPI, by the author: add a trusted publisher for the project `tessri` with owner
# `tianyi-zhang-02`, repository `tessri`, workflow `release.yml` and environment `pypi`. Run by hand on a branch
# (workflow_dispatch), it builds and installs and publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version in the code, and the changelog has its section
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" --out notes.md
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: notes
          path: notes.md

  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scan below reads the history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel and run it on this repository
        run: |
          python -m pip install --quiet dist/*.whl
          tessri --version
          tessri scan . > /dev/null

  publish:
    needs: [build, install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tessri/
    permissions:
      id-token: write # trusted publishing: PyPI accepts this workflow's identity instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Create the GitHub release with the changelog section and the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Tessri ${GITHUB_REF_NAME#v}" --notes-file notes.md
