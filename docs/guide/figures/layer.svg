<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="title">
<title id="title">An agent or a person writes a change. Tessri reads the code and its git history, offline, and hands the person who stands behind the code four answers: where to look first, who can look, what changed in the structure, what nobody maintains.</title>
<style>svg{color:#4e4863}text{font-family:Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:12px;fill:#4e4863}.t{font-size:13.5px;font-weight:500;fill:#17151e}.mut{font-size:11px;fill:#7b7590}.mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.acc{font-size:15px;font-weight:600;fill:#5544b4}.box{fill:#ffffff;stroke:#4e4863;stroke-width:1.1}.hi{stroke:#5544b4;stroke-width:1.6}.edge{fill:none;stroke:#4e4863;stroke-width:1.1}.dash{stroke-dasharray:4 4}.soft{stroke:#e0dcf0}.rod{stroke:#e0dcf0;stroke-width:2}.grey{fill:#7b7590;stroke:#ffffff;stroke-width:2}.viol{fill:#5544b4;stroke:#ffffff;stroke-width:2}.ring{fill:#ffffff;stroke:#4e4863;stroke-width:1.6}.well{fill:#f0eef8}.bg{fill:#ffffff}@media (prefers-color-scheme: dark){svg{color:#c1bacf}text{font-family:Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:12px;fill:#c1bacf}.t{font-size:13.5px;font-weight:500;fill:#f0eef6}.mut{font-size:11px;fill:#8b86a0}.mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.acc{font-size:15px;font-weight:600;fill:#b0a0ff}.box{fill:#151222;stroke:#c1bacf;stroke-width:1.1}.hi{stroke:#b0a0ff;stroke-width:1.6}.edge{fill:none;stroke:#c1bacf;stroke-width:1.1}.dash{stroke-dasharray:4 4}.soft{stroke:#2b2842}.rod{stroke:#2b2842;stroke-width:2}.grey{fill:#8b86a0;stroke:#151222;stroke-width:2}.viol{fill:#b0a0ff;stroke:#151222;stroke-width:2}.ring{fill:#151222;stroke:#c1bacf;stroke-width:1.6}.well{fill:#171424}.bg{fill:#151222}}</style>
<rect class="bg" width="880" height="220" rx="12"/>
<defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect class="box" x="20" y="60" width="176" height="100" rx="8"/>
<text class="t" x="108" y="104" text-anchor="middle">An agent, or a person</text>
<text class="mut" x="108" y="126" text-anchor="middle">writes a change</text>
<line class="edge" x1="196" y1="110" x2="288" y2="110" marker-end="url(#arrow-a)"/>
<text class="mut" x="242" y="100" text-anchor="middle">a change</text>
<rect class="box hi" x="290" y="30" width="290" height="160" rx="10"/>
<text class="acc" x="435" y="68" text-anchor="middle">Tessri</text>
<text x="435" y="94" text-anchor="middle">reads the code and its git history</text>
<text class="mut" x="435" y="116" text-anchor="middle">offline · no model · zero dependencies</text>
<text class="mut" x="435" y="136" text-anchor="middle">never edits the code</text>
<text class="mut" x="435" y="168" text-anchor="middle">every line traceable with <tspan class="mono">tessri why</tspan></text>
<line class="edge" x1="580" y1="62" x2="688" y2="62" marker-end="url(#arrow-a)"/>
<line class="edge" x1="580" y1="97" x2="688" y2="97" marker-end="url(#arrow-a)"/>
<line class="edge" x1="580" y1="132" x2="688" y2="132" marker-end="url(#arrow-a)"/>
<line class="edge" x1="580" y1="167" x2="688" y2="167" marker-end="url(#arrow-a)"/>
<text x="634" y="54" text-anchor="middle">where to look first</text>
<text x="634" y="89" text-anchor="middle">who can look</text>
<text x="634" y="124" text-anchor="middle">what changed in the structure</text>
<text x="634" y="159" text-anchor="middle">what nobody maintains</text>
<rect class="box" x="690" y="40" width="172" height="150" rx="8"/>
<text class="t" x="776" y="106" text-anchor="middle">The person who</text>
<text class="t" x="776" y="124" text-anchor="middle">stands behind it</text>
<text class="mut" x="776" y="150" text-anchor="middle">reviews · maintains · decides</text>
      
</svg>
