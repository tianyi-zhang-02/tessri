<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 236" width="780" height="236" role="img" aria-labelledby="title">
<title id="title">On two repositories&#x27; pull requests, the share where at least one offered name actually reviewed: Tessri&#x27;s list 0.47 and 0.59, a plain count of recent committers 0.46 and 0.61, the busiest committers 0.36 and 0.71, and the people who reviewed most before, whom git cannot see, 0.80 and 0.87.</title>
<style>svg{color:#4e4863}text{font-family:Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:12px;fill:#4e4863}.t{font-size:13.5px;font-weight:500;fill:#17151e}.mut{font-size:11px;fill:#7b7590}.mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.acc{font-size:15px;font-weight:600;fill:#5544b4}.box{fill:#ffffff;stroke:#4e4863;stroke-width:1.1}.hi{stroke:#5544b4;stroke-width:1.6}.edge{fill:none;stroke:#4e4863;stroke-width:1.1}.dash{stroke-dasharray:4 4}.soft{stroke:#e0dcf0}.rod{stroke:#e0dcf0;stroke-width:2}.grey{fill:#7b7590;stroke:#ffffff;stroke-width:2}.viol{fill:#5544b4;stroke:#ffffff;stroke-width:2}.ring{fill:#ffffff;stroke:#4e4863;stroke-width:1.6}.well{fill:#f0eef8}.bg{fill:#ffffff}@media (prefers-color-scheme: dark){svg{color:#c1bacf}text{font-family:Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:12px;fill:#c1bacf}.t{font-size:13.5px;font-weight:500;fill:#f0eef6}.mut{font-size:11px;fill:#8b86a0}.mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.acc{font-size:15px;font-weight:600;fill:#b0a0ff}.box{fill:#151222;stroke:#c1bacf;stroke-width:1.1}.hi{stroke:#b0a0ff;stroke-width:1.6}.edge{fill:none;stroke:#c1bacf;stroke-width:1.1}.dash{stroke-dasharray:4 4}.soft{stroke:#2b2842}.rod{stroke:#2b2842;stroke-width:2}.grey{fill:#8b86a0;stroke:#151222;stroke-width:2}.viol{fill:#b0a0ff;stroke:#151222;stroke-width:2}.ring{fill:#151222;stroke:#c1bacf;stroke-width:1.6}.well{fill:#171424}.bg{fill:#151222}}</style>
<rect class="bg" width="780" height="236" rx="12"/>
<circle class="viol" cx="238" cy="22" r="6"/><text x="250" y="26">large repository, squashed, a company's team</text>
<circle class="ring" cx="538" cy="22" r="6"/><text x="550" y="26">small repository, merge commits, a few core developers</text>
<line class="soft" x1="250" y1="190" x2="730" y2="190"/>
<text class="mut" x="250" y="208" text-anchor="middle">0.3</text>
<text class="mut" x="370" y="208" text-anchor="middle">0.45</text>
<text class="mut" x="490" y="208" text-anchor="middle">0.6</text>
<text class="mut" x="610" y="208" text-anchor="middle">0.75</text>
<text class="mut" x="730" y="208" text-anchor="middle">0.9</text>
<text class="mut" x="490" y="226" text-anchor="middle">share of pull requests where at least one offered name reviewed</text>
<text class="t" x="236" y="66" text-anchor="end">who can look, as Tessri offers it</text>
<line class="rod" x1="386" y1="62" x2="482" y2="62"/><circle class="viol" cx="386" cy="62" r="6"/><circle class="ring" cx="482" cy="62" r="6"/>
<text class="mut" x="375" y="66" text-anchor="end">0.47</text><text x="493" y="66">0.59</text>
<text x="236" y="102" text-anchor="end">committers to the changed files, last year</text>
<line class="rod" x1="378" y1="98" x2="498" y2="98"/><circle class="grey" cx="378" cy="98" r="6"/><circle class="ring" cx="498" cy="98" r="6"/>
<text class="mut" x="367" y="102" text-anchor="end">0.46</text><text x="509" y="102">0.61</text>
<text x="236" y="138" text-anchor="end">busiest committers, last 90 days</text>
<line class="rod" x1="298" y1="134" x2="578" y2="134"/><circle class="grey" cx="298" cy="134" r="6"/><circle class="ring" cx="578" cy="134" r="6"/>
<text class="mut" x="287" y="138" text-anchor="end">0.36</text><text x="589" y="138">0.71</text>
<text x="236" y="174" text-anchor="end">most frequent past reviewers (git cannot see them)</text>
<line class="rod" x1="650" y1="170" x2="706" y2="170"/><circle class="grey" cx="650" cy="170" r="6"/><circle class="ring" cx="706" cy="170" r="6"/>
