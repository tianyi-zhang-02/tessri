<line class="rod" x1="382" y1="116" x2="476" y2="116"/>
<circle class="grey" cx="382" cy="116" r="6"/><circle class="viol" cx="476" cy="116" r="6"/>
<text class="mut" x="371" y="120" text-anchor="end">0.54</text><text x="487" y="120">0.64</text>
